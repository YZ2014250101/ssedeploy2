# WebSocket 升级头：普通请求为空，带 Upgrade 头的请求映射为 upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 后端服务地址：docker-compose 中服务名为 backend
upstream ssedeploy_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传/请求体限制（环境变量、启动命令体量很小，这里留足余量）
    client_max_body_size 8m;

    # gzip 压缩，减少前端静态资源体积
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 静态资源带 hash，可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST 接口反向代理
    location /api/ {
        proxy_pass http://ssedeploy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（终端、日志流）需要 Upgrade 透传，且不能被缓冲
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 健康检查透传
    location = /healthz {
        proxy_pass http://ssedeploy_backend;
        proxy_set_header Host $host;
    }

    # SPA 路由回退：/pods、/pods/xxx 等前端路由都交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
