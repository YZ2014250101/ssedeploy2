# =============================================================================
# SSEDeploy 离线交付编排（内嵌 K3s，目标机只需安装 Docker）
#
# 服务拓扑：
#   k3s        —— 内嵌轻量 Kubernetes（rancher/k3s 容器，特权模式，数据落 k3s-data 卷）
#   bootstrap  —— 一次性任务：等待 k3s 就绪后创建命名空间与全局共享存储 PV/PVC
#   backend    —— Go/Gin 后端，通过共享卷中的 kubeconfig 访问 k3s
#   frontend   —— Nginx 托管 React 静态资源，/api 与 WebSocket 反代到 backend
#
# 使用方式：
#   docker compose up -d        # 首次启动会自动完成共享存储初始化
#   docker compose ps           # 查看状态
#   docker compose logs -f      # 查看日志
#
# 所有可配置项见同目录 .env（由 .env.example 复制生成）。
# =============================================================================
name: ssedeploy

services:
  # ---------------------------------------------------------------------------
  # 内嵌 K3s：用户无需在宿主机单独安装 K3s / kubectl
  # 说明：privileged 是 k3s-in-docker 的必要条件；/shared 卷与后端共享，
  #       通过静态 PV 暴露给用户 Pod，实现全局跨 Pod 共享目录。
  # ---------------------------------------------------------------------------
  k3s:
    image: ${K3S_IMAGE:-rancher/k3s:v1.35.5-k3s1}
    container_name: ssedeploy-k3s
    # 固定 hostname：K3s 默认用主机名作为节点名，容器重启后 hostname 会变成新的
    # Container ID，导致集群里不断新增 NotReady 僵尸节点，这里强制固定节点名。
    hostname: k3s-node
    restart: unless-stopped
    privileged: true
    # healthcheck 中的 kubectl 使用容器内默认 kubeconfig
    environment:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    command:
      - server
      # 关闭内置 Traefik / ServiceLB：平台只需 API，不需要对外暴露 Ingress
      - --disable=traefik
      - --disable=servicelb
      # 证书 SAN 加入服务名 k3s，使 backend 能以 https://k3s:6443 访问 API
      - --tls-san=k3s
      - --write-kubeconfig-mode=644
    tmpfs:
      # k3s 运行期临时目录
      - /run
      - /var/run
    volumes:
      # 集群数据（etcd 等价物 sqlite、镜像、Pod 数据卷）持久化
      - k3s-data:/var/lib/rancher/k3s
      # kubeconfig 落在该卷，供 backend / bootstrap 只读挂载
      - k3s-config:/etc/rancher/k3s
      # Docker Hub 镜像加速：K3s 启动时读取，避免国内直连 docker.io 超时
      - ./manifests/registries.yaml:/etc/rancher/k3s/registries.yaml:ro
      # 全局共享目录：与 backend 的 /shared 是同一个 Docker 卷
      - ssedeploy-shared:/shared
    ports:
      # 预置端口，可在 .env 修改；仅用于本机 kubectl 调试，可去掉
      - "${K3S_API_PORT:-6443}:6443"
      - "30000-30300:30000-30300"
    healthcheck:
      test: ["CMD", "kubectl", "get", "--raw", "/readyz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    labels:
      com.ssedeploy.version: "${APP_VERSION:-1.0.0}"
      com.ssedeploy.component: "k3s"

  # ---------------------------------------------------------------------------
  # 一次性初始化：创建命名空间 + 全局共享目录 PV/PVC
  # 必须在 backend 之前完成，否则 backend 会创建出指向容器内 local-path 的 PVC，
  # 导致后端 /shared 与用户 Pod 的 /shared 不是同一份数据。
  # ---------------------------------------------------------------------------
  bootstrap:
    image: ${K3S_IMAGE:-rancher/k3s:v1.35.5-k3s1}
    container_name: ssedeploy-bootstrap
    restart: "no"
    depends_on:
      k3s:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # --server 覆盖 kubeconfig 中的 127.0.0.1，直接从容器网络访问 k3s API
    command:
      - >-
        kubectl --kubeconfig /kube/k3s.yaml --server https://k3s:6443
        apply -f /manifests/shared-pv.yaml &&
        echo "[bootstrap] 命名空间与全局共享存储已就绪"
    volumes:
      - k3s-config:/kube:ro
      - ./manifests:/manifests:ro
    labels:
      com.ssedeploy.version: "${APP_VERSION:-1.0.0}"
      com.ssedeploy.component: "bootstrap"

  # ---------------------------------------------------------------------------
  # 后端：Go + Gin + client-go，SQLite 持久化
  # entrypoint 会等待 kubeconfig 生成并改写 server 地址后再启动二进制
  # ---------------------------------------------------------------------------
  backend:
    image: ssedeploy/backend:${APP_VERSION:-1.0.0}
    container_name: ssedeploy-backend
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/scripts/backend-entrypoint.sh"]
    environment:
      SSD_HTTP_ADDR: ":8080"
      SSD_DB_PATH: "/app/data/ssedeploy.db"
      SSD_K8S_NAMESPACE: "${K8S_NAMESPACE:-ssedeploy}"
      # 首次启动创建的管理员账号（登录后请尽快修改密码）
      SSD_ADMIN_USER: "${ADMIN_USER:-admin}"
      SSD_ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
      SSD_JWT_SECRET: "${JWT_SECRET:-ssedeploy-dev-secret-please-change}"
      SSD_METRICS_INTERVAL: "15s"
      # 全局共享目录：与 k3s 容器 /shared 挂载同一个 Docker 卷
      SSD_SHARED_DIR: "/shared"
      # k3s API 地址与 kubeconfig 来源（由 entrypoint 改写后使用）
      K3S_API_SERVER: "https://k3s:6443"
      KUBE_SOURCE: "/kube/k3s.yaml"
      KUBE_DEST: "/tmp/kubeconfig"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - ssedeploy-data:/app/data
      - ssedeploy-shared:/shared
      - k3s-config:/kube:ro
      - ./scripts/backend-entrypoint.sh:/scripts/backend-entrypoint.sh:ro
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    labels:
      com.ssedeploy.version: "${APP_VERSION:-1.0.0}"
      com.ssedeploy.component: "backend"

  # ---------------------------------------------------------------------------
  # 前端：Nginx 静态资源 + /api 反向代理（含 WebSocket 升级）
  # ---------------------------------------------------------------------------
  frontend:
    image: ssedeploy/frontend:${APP_VERSION:-1.0.0}
    container_name: ssedeploy-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    labels:
      com.ssedeploy.version: "${APP_VERSION:-1.0.0}"
      com.ssedeploy.component: "frontend"

# -----------------------------------------------------------------------------
# 持久化卷：容器重建/重启不会丢失数据
#   ssedeploy-data   —— SQLite（用户、Pod 元数据）
#   ssedeploy-shared —— 全局共享目录 /shared（后端与所有用户 Pod 共用）
#   k3s-data         —— K3s 集群状态与用户 Pod 持久卷
#   k3s-config       —— K3s kubeconfig
# -----------------------------------------------------------------------------
volumes:
  ssedeploy-data:
    name: ssedeploy-data
  ssedeploy-shared:
    name: ssedeploy-shared
  k3s-data:
    name: ssedeploy-k3s-data
  k3s-config:
    name: ssedeploy-k3s-config
